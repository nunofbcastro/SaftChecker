name: Atualizar jar FACTEMICLI

on:
  schedule:
    - cron: "0 7 * * 1" # segundas-feiras 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-jar
  cancel-in-progress: false

jobs:
  update-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pedir a versao nova ao proprio jar
        id: fetch
        env:
          SAFT_NIF: "599999993"       # credenciais de TESTE publicas da AT
          SAFT_PASSWORD: "testes1234"
        run: |
          set -u
          current=$(ls data/checker/FACTEMICLI-*-cmdClient.jar | sort -V | tail -n 1)
          echo "Jar atual: $current"

          mkdir -p "$RUNNER_TEMP/new" "$RUNNER_TEMP/probe"
          cat > "$RUNNER_TEMP/probe/probe.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <AuditFile xmlns="urn:OECD:StandardAuditFile-Tax:PT_1.04_01">
            <Header>
              <AuditFileVersion>1.04_01</AuditFileVersion>
              <CompanyID>599999993</CompanyID>
              <TaxRegistrationNumber>599999993</TaxRegistrationNumber>
              <TaxAccountingBasis>F</TaxAccountingBasis>
              <CompanyName>Teste</CompanyName>
              <FiscalYear>2025</FiscalYear>
              <StartDate>2025-01-01</StartDate>
              <EndDate>2025-01-31</EndDate>
              <CurrencyCode>EUR</CurrencyCode>
              <DateCreated>2025-02-01</DateCreated>
              <TaxEntity>Global</TaxEntity>
              <ProductCompanyTaxID>599999993</ProductCompanyTaxID>
              <SoftwareCertificateNumber>0</SoftwareCertificateNumber>
              <ProductID>Teste/Teste</ProductID>
              <ProductVersion>1</ProductVersion>
            </Header>
          </AuditFile>
          EOF

          # -c TEM de ser uma pasta (com "/" no fim): com caminho de ficheiro o download falha.
          java -jar "$current" -c "$RUNNER_TEMP/new/" \
            -i "$RUNNER_TEMP/probe/probe.xml" \
            -n "$SAFT_NIF" -p "$SAFT_PASSWORD" -a 2025 -m 01 -op validar || true

          # Em Linux o jar grava o ficheiro com um prefixo estranho no nome (ex.: "\FACTEMICLI-...jar"),
          # por isso procuramos com "*" a frente e normalizamos o nome.
          raw=$(find "$RUNNER_TEMP/new" -maxdepth 1 -type f -name '*FACTEMICLI-*-cmdClient.jar' | head -n 1)
          if [ -z "$raw" ]; then
            echo "Sem versao nova."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          name=$(basename "$raw" | grep -o 'FACTEMICLI-.*-cmdClient\.jar')
          mkdir -p "$RUNNER_TEMP/clean"
          cp "$raw" "$RUNNER_TEMP/clean/$name"

          unzip -tq "$RUNNER_TEMP/clean/$name"   # falha o job se o jar vier corrompido

          if [ "$(printf '%s\n%s\n' "$(basename "$current")" "$name" | sort -V | tail -n 1)" = "$(basename "$current")" ]; then
            echo "O jar descarregado ($name) nao e mais novo que o atual."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "new=$RUNNER_TEMP/clean/$name" >> "$GITHUB_OUTPUT"

      - name: Commit do jar novo
        if: steps.fetch.outputs.updated == 'true'
        run: |
          new="${{ steps.fetch.outputs.new }}"
          name=$(basename "$new")

          git rm -q --ignore-unmatch data/checker/FACTEMICLI-*-cmdClient.jar
          mkdir -p data/checker
          cp "$new" "data/checker/$name"
          git add -f "data/checker/$name"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: atualizar jar FACTEMICLI para $name"
          git push
